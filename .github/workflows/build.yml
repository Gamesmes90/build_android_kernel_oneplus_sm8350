name: Build and Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Download kernel tree
        run: git clone --depth 1 --no-single-branch https://github.com/Gamesmes90/android_kernel_oneplus_sm8350.git

      - name: Downloade Lineage OS build
        run: bash build.sh lemonadep
      
      - name: Versioning Setup
        run: |
          source .github/workflows/versioning

          # This check is to avoid uploading to the same tag if there happens to be multiple builds in one day
          # Initialize variables
          NEW_VERSION="$VERSION"
          TAG="$NEW_VERSION-$ANDROID_VERSION-$DATE"
          COUNTER=1
          
          # Query the remote repo. Loop and update NEW_VERSION and TAG if it already exists.
          while git ls-remote --tags "https://${{ secrets.TOKEN }}@github.com/Gamesmes90/android_kernel_oneplus_sm8350.git" "refs/tags/$TAG" | grep -q "refs/tags/$TAG"; do
            NEW_VERSION="${VERSION}-${COUNTER}"
            TAG="$NEW_VERSION-$ANDROID_VERSION-$DATE"
            COUNTER=$((COUNTER + 1))
          done
          
          echo "Available tag generated: $TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Initialize BakaSU
        run: |
          cd android_kernel_oneplus_sm8350
          bash scripts/init_ksu.sh bakasu
          cd ..

      - name: Build with BakaSU
        run: |
          bash build.sh
          mv build/kernel-oneplus-sm8350.zip build/kernel-oneplus-sm8350-${{ env.TAG }}-bakasu.zip

      - name: Initialize KernelSU Next SUSFS
        run: |
          rm -rf android_kernel_oneplus_sm8350/KernelSU
          cd android_kernel_oneplus_sm8350
          bash scripts/init_ksu.sh susfs
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add fs/exec.c
          git commit -m "Remove ksu_handle_post_execveat"
          cd ..

      - name: Build with KernelSU Next
        run: |
          bash build.sh
          mv build/kernel-oneplus-sm8350.zip build/kernel-oneplus-sm8350-${{ env.TAG }}-ksun.zip

      - name: Generate Changelog
        run: |
          cd android_kernel_oneplus_sm8350
          bash .github/generate_changelog.sh

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          repository: Gamesmes90/android_kernel_oneplus_sm8350
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: |
            build/kernel-oneplus-sm8350-${{ env.TAG }}-ksun.zip
            build/kernel-oneplus-sm8350-${{ env.TAG }}-bakasu.zip
          body_path: android_kernel_oneplus_sm8350/.github/release_notes.txt
          token: ${{ secrets.TOKEN }}
