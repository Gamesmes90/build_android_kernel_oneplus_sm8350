name: Build and Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Download kernel tree
        run: git clone https://github.com/Gamesmes90/android_kernel_oneplus_sm8350.git

      - name: Initialize Kernel SU Next SUSFS
        run: |
          cd android_kernel_oneplus_sm8350
          bash init_ksu.sh susfs
          cd ..

      - name: Downloade Lineage OS build
        run: bash build.sh lemonadep
      
      - name: Setup and build
        run: |
          source .github/workflows/versioning
          echo "TAG=$VERSION-$ANDROID_VERSION-$DATE" >> $GITHUB_ENV
          bash build.sh
          mv build/kernel-oneplus-sm8350.zip build/kernel-oneplus-sm8350-$VERSION-$ANDROID_VERSION-$DATE.zip

      - name: Generate Changelog
        run: |
          cd android_kernel_oneplus_sm8350
          bash .github/generate_changelog.sh

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          repository: Gamesmes90/android_kernel_oneplus_sm8350
          tag_name: ${{ env.TAG }}
          name: Kernel OnePlus sm8350 ${{ env.TAG }}
          files: build/kernel-oneplus-sm8350-${{ env.TAG }}.zip
          body_path: android_kernel_oneplus_sm8350/.github/release_notes.txt
          token: ${{ secrets.TOKEN }}
